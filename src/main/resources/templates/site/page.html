<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${documentTitle}">ken.blog</title>
    <meta name="description" th:content="${summary}">
    <meta property="og:title" th:content="${socialTitle}">
    <meta property="og:description" th:content="${summary}">
    <meta property="og:url" th:content="${canonical}">
    <meta property="og:site_name" content="ken.blog">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:type" th:content="${ogType}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" th:content="${socialTitle}">
    <meta name="twitter:description" th:content="${summary}">
    <link rel="canonical" th:href="${canonical}">
    <link rel="stylesheet" th:href="${assetsCss}"></head>
  <body th:attr="data-route=${#strings.toLowerCase(section)}">
    <div class="site-root">
      <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
      <header class="site-header">
        <div class="header-inner">
          <a class="brand" th:href="${base}" aria-label="ken.blog 홈"><svg
              width="32"
              height="32"
              viewBox="0 0 48 48"
              fill="none"
              stroke="currentColor"
              stroke-width="2.6"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            ><g transform="rotate(-45 24 24)"><path d="M8 12.5 L45 24 L8 35.5 Z"/><path d="M14 14.4 Q17.5 24 14 33.6 M22 16.9 Q24.8 24 22 31.1 M30 19.4 Q32 24 30 28.6 M37 21.6 Q38.2 24 37 26.4"/></g></svg><span>ken<span class="brand-dot">.</span>blog</span></a>
          <nav class="main-nav" aria-label="주 메뉴">
            <a
              th:each="item : ${nav}"
              th:href="${item.href}"
              th:text="${item.label}"
              th:attr="aria-current=${item.active ? 'page' : null}"
            >Home</a>
          </nav>
          <div class="header-actions">
            <div class="header-search-unit" th:classappend="${section == 'Search'} ? 'is-open' : ''">
              <button
                id="header-search-toggle"
                type="button"
                class="header-search-toggle"
                th:attr="aria-label=${section == 'Search' ? '검색 닫기' : '검색 열기'},aria-expanded=${section == 'Search'}"
                aria-controls="site-search"
              ><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg></button>
              <form
                class="header-search"
                role="search"
                th:action="${base + 'search/'}"
                th:attr="aria-hidden=${section != 'Search'},inert=${section == 'Search' ? null : 'inert'}"
              >
                <label class="sr-only" for="site-search">글 검색</label><input id="site-search" name="q" type="search" placeholder="제목 · 본문 · 태그 검색"><button id="header-search-close" type="button" class="header-search-close" aria-label="검색 닫기">×</button>
              </form>
            </div>
            <button
              id="theme-toggle"
              type="button"
              class="theme-switch"
              role="switch"
              aria-checked="false"
              aria-label="다크 모드"
              title="다크 모드 꺼짐"
            ><span class="theme-switch-track"><span class="theme-switch-thumb"><span class="theme-icon-sun"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42"/></svg></span><span class="theme-icon-moon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.6 14.1A8.6 8.6 0 0 1 9.9 3.4 8.6 8.6 0 1 0 20.6 14.1Z"/></svg></span></span></span></button><a class="header-text-button" th:if="${!#strings.isEmpty(adminHref)}" th:href="${adminHref}">관리자</a>
          </div>
        </div>
      </header>
      <div class="site-content">
        <main th:replace="~{views/__${view}__ :: main}">
        </main>
      </div>
      <footer class="site-footer">
        <span th:text="|© ${year} ken.blog|">© ken.blog</span>
        <div>
          <a th:href="${github}" rel="noopener noreferrer">GitHub</a><a th:if="${!#strings.isEmpty(adminHref)}" th:href="${adminHref}">관리자</a>
        </div>
      </footer>
    </div>
    <script type="module" th:src="${assetsJs}"></script>
  </body>
</html>
