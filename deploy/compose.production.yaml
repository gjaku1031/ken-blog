# 독립 운영 스택 --env-file에 저장소 밖 0600 production.env 사본을 지정
# DB는 기존 외부 MySQL을 사용하며, api와 caddy만 이 Compose 네트워크에 둠
# 파일 위치 변경 후에도 기존 컨테이너·볼륨의 기본 프로젝트 이름 유지
name: ken-blog

# 서비스 실행 구성
services:
  # DB·이미지 저장소를 사용하는 API 컨테이너
  api:
    # 검증된 CI 이미지 아카이브를 먼저 docker load 하고 SHA 태그를 지정
    image: ${KEN_BLOG_API_IMAGE:?Reviewed JVM image tag is required}
    user: "10001:1001"
    restart: unless-stopped
    # 저장소 밖 운영 접속 정보를 원문 그대로 주입
    env_file:
      - path: ${KEN_BLOG_PRODUCTION_ENV_FILE:?Dedicated production env file is required}
        required: true
        format: raw
    # 운영 HTTPS·Pages origin·저장소 경로 고정
    environment:
      SERVER_PORT: "8080"
      SERVER_FORWARD_HEADERS_STRATEGY: none
      # 검토된 SQL 적용 후 운영 기동은 스키마 검증만 수행
      APP_JPA_DDL_AUTO: validate
      APP_SQL_INIT_MODE: never
      AUTH_PROXY_KEY: ${AUTH_PROXY_KEY:?Shared proxy key of at least 32 characters is required}
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_SAME_SITE: none
      SESSION_COOKIE_PARTITIONED: "true"
      APP_CORS_ALLOWED_ORIGINS: https://gjaku1031.github.io
      APP_AUTH_CORS_ALLOWED_ORIGINS: https://gjaku1031.github.io
      APP_ASSETS_DIRECTORY: /var/lib/ken-blog/assets
      # JVM 외 메모리를 위해 10% 여유 확보 힙은 Paketo가 계산
      BPL_JVM_HEAD_ROOM: ${BPL_JVM_HEAD_ROOM:-10}
      # Hibernate·jOOQ 동적 클래스 로딩을 위한 메타스페이스 힙은 남은 공간에서 계산
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxMetaspaceSize=256m}
    # release.sh의 compose up --wait가 기다리는 상태 검사. 실행 이미지에 curl이 없어 bash 내장 /dev/tcp로 요청하고 상태 코드 200만 healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && read -r _ code _ <&3 && [ \"$$code\" = 200 ]"]
      # 기동(1 CPU에서 약 25초) 동안의 실패는 세지 않고 2초 간격으로 확인함
      start_period: 120s
      start_interval: 2s
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "127.0.0.1:${API_PORT:-18081}:8080"
    volumes:
      - type: bind
        source: ${KEN_BLOG_ASSETS_DIR:?Durable local assets directory is required}
        target: /var/lib/ken-blog/assets
        read_only: true
        bind:
          create_host_path: false
    # JVM 힙 외 메모리를 포함한 컨테이너 전체 한도
    mem_limit: ${API_MEMORY_LIMIT:-1536m}
    cpus: 1.0

  # 공개 TLS 종료와 허용 API 경로 프록시
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      KEN_BLOG_PUBLIC_IP: ${KEN_BLOG_PUBLIC_IP:?Public IPv4 certificate SAN is required}
      AUTH_PROXY_KEY: ${AUTH_PROXY_KEY:?Shared proxy key of at least 32 characters is required}
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "${KEN_BLOG_PUBLIC_BIND_IP:?Private NIC bind IPv4 is required}:80:80"
      - "${KEN_BLOG_PUBLIC_BIND_IP:?Private NIC bind IPv4 is required}:443:443"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - ken_blog_caddy_data:/data
      - ken_blog_caddy_config:/config

# 재시작 이후에도 유지할 named volume
volumes:
  ken_blog_caddy_data:
  ken_blog_caddy_config:
