spring:
  application:
    name: ken-blog-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  bootstrap:
    admin:
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      password-hash: ${BOOTSTRAP_ADMIN_PASSWORD_HASH:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://gjaku1031.github.io}
