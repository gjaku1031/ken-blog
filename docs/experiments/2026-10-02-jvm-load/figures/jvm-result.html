<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>도착률별 p95와 호스트 CPU</title>
<style>
/* 수치 출처: docs/ADR/ADR_infra.md "JVM 실서버 부하·메모리 측정"(b768152 기준 258~270행) 표의
   "공개 상태 30% + 배지 70%, 쿠키 없음" 네 행. 게시글 post-489faedf…의 '요청별 결과' 표와 같음 */
:root { --bg:#ffffff; --panel:#f6f7f9; --ink:#1a2030; --soft:#4a5368; --muted:#6b7386; --line:#d3d8e1; --grid:#e3e7ee;
  --acc:#2b59c3; --cpu:#b06d00; --cpu-soft:#f3dfb8; }
@media (prefers-color-scheme: dark) { :root { --bg:#171b24; --panel:#1d2230; --ink:#e4e8f0; --soft:#a9b2c3; --muted:#8a93a6; --line:#2c3442; --grid:#2a3140;
  --acc:#7aa2ff; --cpu:#e3a64a; --cpu-soft:#4a3a1f; } }
body { margin:0; background:var(--bg); font-family:"Noto Sans CJK KR","Apple SD Gothic Neo",sans-serif; }
#figure { width:1200px; padding:28px; box-sizing:border-box; background:var(--bg); }
svg text { fill:var(--ink); font-size:15px; }
.panel { fill:var(--panel); stroke:var(--line); }
.h { font-size:18px; font-weight:700; }
.sub { fill:var(--muted); font-size:13.5px; }
.axis { fill:var(--muted); font-size:13px; }
.grid { stroke:var(--grid); stroke-width:1; }
.b { font-weight:600; }
.lab { font-size:14px; font-weight:700; }
.note { fill:var(--acc); font-size:13.5px; font-weight:600; }
</style></head><body>
<div id="figure"><svg id="chart" viewBox="0 0 1144 452" width="1144" height="452" role="img"
aria-label="도착률 10, 50, 100, 200건/초에서 p95는 23.55, 15.20, 10.17, 33.41ms로 오르내렸고, 호스트 평균 CPU는 18.4, 43.6, 57.5, 88.4%로 계속 올랐음"></svg></div>
<script>
(() => {
  const RATES = [10, 50, 100, 200];
  const P95 = [23.55, 15.20, 10.17, 33.41];
  const CPU = [18.4, 43.6, 57.5, 88.4];
  const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("chart");
  const el = (t, a, txt) => { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); if (txt != null) n.textContent = txt; svg.appendChild(n); return n; };
  const PW = 552, PH = 420, PT = 0;
  const frame = (x0, title, sub, max, step, unit) => {
    el("rect", { x: x0, y: PT, width: PW, height: PH, rx: 14, class: "panel" });
    el("text", { x: x0 + 24, y: PT + 34, class: "h" }, title);
    el("text", { x: x0 + 24, y: PT + 56, class: "sub" }, sub);
    const L = x0 + 70, R = x0 + PW - 28, T = PT + 92, B = PT + 360;
    const Y = v => B - v / max * (B - T);
    const X = i => L + (i + 0.5) * (R - L) / RATES.length;
    for (let v = 0; v <= max; v += step) {
      el("line", { x1: L, x2: R, y1: Y(v), y2: Y(v), class: "grid" });
      el("text", { x: L - 10, y: Y(v) + 4, "text-anchor": "end", class: "axis" }, v + unit);
    }
    RATES.forEach((r, i) => el("text", { x: X(i), y: B + 22, "text-anchor": "middle", class: "axis" }, r + "건/초"));
    el("text", { x: (L + R) / 2, y: B + 46, "text-anchor": "middle", class: "axis" }, "도착률");
    return { X, Y, B };
  };

  // 왼쪽: p95 지연
  const a = frame(0, "p95 지연", "도착률마다 30초 한 번 관측", 40, 10, "ms");
  el("polyline", { points: P95.map((v, i) => `${a.X(i)},${a.Y(v)}`).join(" "), style: "fill:none;stroke:var(--acc);stroke-width:3" });
  P95.forEach((v, i) => {
    el("circle", { cx: a.X(i), cy: a.Y(v), r: 6, style: "fill:var(--acc)" });
    el("text", { x: a.X(i), y: a.Y(v) + (i === 2 ? 28 : -14), "text-anchor": "middle", class: "lab" }, v.toFixed(2));  // 100건/초는 올라가는 선과 겹치지 않게 아래에
  });
  // 줄어든 구간 표시
  el("text", { x: a.X(1), y: a.Y(10.17) + 58, "text-anchor": "middle", class: "note" }, "10→100건/초에서는 오히려 줄어듦");

  // 오른쪽: 호스트 평균 CPU
  const c = frame(PW + 40, "호스트 평균 CPU", "API·MySQL·OS를 합친 서버 전체 · 1코어", 100, 25, "%");
  CPU.forEach((v, i) => {
    const w = 58;
    el("rect", { x: c.X(i) - w / 2, y: c.Y(v), width: w, height: c.B - c.Y(v), rx: 4,
      style: `fill:${i === 3 ? "var(--cpu)" : "var(--cpu-soft)"};stroke:var(--cpu);stroke-width:1.2` });
    el("text", { x: c.X(i), y: c.Y(v) - 10, "text-anchor": "middle", class: "lab" }, v.toFixed(1) + "%");
  });
  el("text", { x: 0, y: PH + 26, class: "axis" }, "요청: 공개 상태 30% + 배지 70%. 모든 도착률에서 오류 0건.");
  document.body.dataset.ready = "1";
})();
</script></body></html>
