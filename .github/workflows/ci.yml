name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_DATABASE: ken_blog_ci
          MYSQL_USER: ci_api
          MYSQL_PASSWORD: ci_ephemeral_only
          MYSQL_ROOT_PASSWORD: ci_root_ephemeral_only
        ports:
          - 13307:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Build API
        run: ./mvnw -B clean verify
      - name: Check API health over HTTP
        env:
          DB_URL: jdbc:mysql://127.0.0.1:13307/ken_blog_ci
          DB_USERNAME: ci_api
          DB_PASSWORD: ci_ephemeral_only
          SESSION_COOKIE_SECURE: 'false'
        run: |
          java -jar target/ken-blog-api-0.0.1-SNAPSHOT.jar \
            --server.address=127.0.0.1 --server.port=18081 > api.log 2>&1 &
          api_pid=$!
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then cat api.log; fi
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT
          response=$(curl --fail --silent --retry 30 \
            --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:18081/actuator/health)
          python3 -c 'import json, sys; sys.exit(0 if json.loads(sys.argv[1]).get("status") == "UP" else 1)' "$response"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Check web types
        run: npm run typecheck
      - name: Test web status handling
        run: npm test
      - name: Build web
        env:
          NEXT_PUBLIC_BASE_PATH: /ken-blog
          NEXT_PUBLIC_API_BASE_URL: ''
        run: npm run build
      - name: Check static web over HTTP
        run: |
          mkdir -p "$RUNNER_TEMP/ken-blog-site/ken-blog"
          cp -a out/. "$RUNNER_TEMP/ken-blog-site/ken-blog/"
          python3 -m http.server 18080 --bind 127.0.0.1 \
            --directory "$RUNNER_TEMP/ken-blog-site" > web.log 2>&1 &
          web_pid=$!
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then cat web.log; fi
            kill "$web_pid" 2>/dev/null || true
            wait "$web_pid" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT
          curl --fail --silent --retry 30 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:18080/ken-blog/ > home.html
          python3 - <<'PY'
          import re
          import urllib.request

          html = open('home.html', encoding='utf-8').read()
          assert '<title>ken.blog</title>' in html
          assert '공개 API 주소가 아직 설정되지 않았습니다.' in html
          assert '/ken-blog/architecture/architecture.svg' in html
          assert '/ken-blog/architecture/architecture.dark.svg' in html
          for route in ('tech/', 'post/', 'login/', 'projects/', 'notes/'):
              with urllib.request.urlopen('http://127.0.0.1:18080/ken-blog/' + route) as response:
                  assert response.status == 200
                  assert '<title>ken.blog</title>' in response.read().decode('utf-8')
          asset = re.search(r'/ken-blog/_next/static/[^" ]+\.js', html)
          assert asset is not None
          with urllib.request.urlopen('http://127.0.0.1:18080' + asset.group()) as response:
              assert response.status == 200
          with urllib.request.urlopen('http://127.0.0.1:18080/ken-blog/architecture/architecture.svg') as response:
              assert response.status == 200
          with urllib.request.urlopen('http://127.0.0.1:18080/ken-blog/architecture/architecture.dark.svg') as response:
              assert response.status == 200
          PY
