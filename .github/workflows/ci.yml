name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Build API
        run: ./mvnw -B clean verify
      - name: Check API health over HTTP
        run: |
          java -jar target/ken-blog-api-0.0.1-SNAPSHOT.jar \
            --server.address=127.0.0.1 --server.port=18081 > api.log 2>&1 &
          api_pid=$!
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then cat api.log; fi
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT
          response=$(curl --fail --silent --retry 30 \
            --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:18081/actuator/health)
          python3 -c 'import json, sys; sys.exit(0 if json.loads(sys.argv[1]).get("status") == "UP" else 1)' "$response"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Check web types
        run: npm run typecheck
      - name: Test web status handling
        run: npm test
      - name: Build web
        run: npm run build
      - name: Check web home over HTTP
        run: |
          ./node_modules/.bin/next start --hostname 127.0.0.1 --port 18080 > web.log 2>&1 &
          web_pid=$!
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then cat web.log; fi
            kill "$web_pid" 2>/dev/null || true
            wait "$web_pid" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT
          response=$(curl --fail --silent --retry 30 \
            --retry-delay 1 --retry-connrefused http://127.0.0.1:18080/)
          [[ "$response" == *'<title>Ken Blog</title>'* ]]
          [[ "$response" == *'API 연결 주소가 설정되지 않았습니다.'* ]]
