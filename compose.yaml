services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: ken_blog
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:${DB_PORT:-13306}:3306"
    volumes:
      - ken_blog_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" -D \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
  api:
    image: ken-blog-p004-api:local
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://gjaku1031.github.io}
      DB_URL: jdbc:mysql://mysql:3306/ken_blog
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD_HASH: ${BOOTSTRAP_ADMIN_PASSWORD_HASH:-}
      APP_AUTH_CORS_ALLOWED_ORIGINS: ${APP_AUTH_CORS_ALLOWED_ORIGINS:-}
      CACHE_REDIS_ENABLED: ${CACHE_REDIS_ENABLED:-false}
      CACHE_REDIS_HOST: ${CACHE_REDIS_HOST:-}
      CACHE_REDIS_PORT: ${CACHE_REDIS_PORT:-6379}
      CACHE_REDIS_USERNAME: ${CACHE_REDIS_USERNAME:-}
      CACHE_REDIS_PASSWORD: ${CACHE_REDIS_PASSWORD:-}
      CACHE_REDIS_TLS: ${CACHE_REDIS_TLS:-true}
      CACHE_REDIS_PREFIX: ${CACHE_REDIS_PREFIX:-ken-blog:public-posts}
      CACHE_REDIS_TTL_SECONDS: ${CACHE_REDIS_TTL_SECONDS:-300}
      CACHE_REDIS_CONNECT_TIMEOUT_MS: ${CACHE_REDIS_CONNECT_TIMEOUT_MS:-300}
      CACHE_REDIS_COMMAND_TIMEOUT_MS: ${CACHE_REDIS_COMMAND_TIMEOUT_MS:-300}
      OCI_OBJECT_STORAGE_ENDPOINT: ${OCI_OBJECT_STORAGE_ENDPOINT:-}
      OCI_OBJECT_STORAGE_REGION: ${OCI_OBJECT_STORAGE_REGION:-}
      OCI_OBJECT_STORAGE_BUCKET: ${OCI_OBJECT_STORAGE_BUCKET:-}
      OCI_OBJECT_STORAGE_ACCESS_KEY: ${OCI_OBJECT_STORAGE_ACCESS_KEY:-}
      OCI_OBJECT_STORAGE_SECRET_KEY: ${OCI_OBJECT_STORAGE_SECRET_KEY:-}
      OCI_OBJECT_STORAGE_KEY_PREFIX: ${OCI_OBJECT_STORAGE_KEY_PREFIX:-ken-blog/attachments}
    ports:
      - "127.0.0.1:${API_PORT:-18081}:8080"
    mem_limit: 1g

volumes:
  ken_blog_mysql_data:
