<main
  xmlns:th="http://www.thymeleaf.org"
  th:fragment="main"
  id="main-content"
  class="page-container course-page project-layout"
>
  <aside class="project-sidebar course-sidebar" aria-label="과목 탐색">
    <a th:href="${base + 'notes/'}" class="back-link">← Notes</a>
    <h2 th:text="|${course.field} › ${course.name}|">과목</h2>
    <nav aria-label="과목 회차">
      <a th:href="${base + 'course/' + course.slug + '/'}" th:attr="aria-current=${post == null ? 'page' : null}">과목 소개</a>
      <ol>
        <li th:each="chapter : ${chapters}">
          <a
            th:href="${chapter.href}"
            th:attr="aria-current=${post != null and chapter.slug == post.slug ? 'page' : null}"
            th:text="|${chapter.number}강 · ${chapter.title}|"
          >회차</a>
        </li>
      </ol>
    </nav>
    <nav th:replace="~{views/toc :: toc}">
    </nav>
  </aside>
  <article th:if="${post == null}" class="course-main course-intro-layout">
    <div class="course-intro-card card">
      <div class="project-overline" th:text="|${course.field} · ${courseStatus} · ${#lists.size(chapters)}회차|">과목</div>
      <h1 th:text="${course.name}">과목</h1>
      <p th:if="${!#strings.isEmpty(course.description)}" class="project-overview" th:text="${course.description}">
      </p>
    </div>
    <div class="course-list-card card">
      <ol th:if="${!#lists.isEmpty(chapters)}" class="course-chapters">
        <li th:each="chapter : ${chapters}">
          <a th:href="${chapter.href}"><span class="course-chapter-number" th:text="${chapter.displayNumber}">01</span><span class="course-chapter-text"><strong th:text="${chapter.title}">회차</strong><small th:if="${!#strings.isEmpty(chapter.summary)}" th:text="${chapter.summary}">요약</small></span><time th:datetime="${chapter.publishedDate}" th:text="${chapter.displayDate}">날짜</time></a>
        </li>
      </ol>
      <p th:if="${#lists.isEmpty(chapters)}">아직 출간된 회차가 없습니다.</p>
    </div>
  </article>
  <article th:if="${post != null}" class="project-main card course-main">
    <div class="project-overline">Notes · <a th:href="${base + 'course/' + course.slug + '/'}" th:text="${course.name}">과목</a> · <th:block
        th:text="|${chapterPosition}강 / ${#lists.size(chapters)} · ${#strings.replace(#strings.substring(post.publishedDate, 0, 10), '-', '.')}|"
      ></th:block>
    </div>
    <h1 th:text="${post.title}">제목</h1>
    <div class="markdown-body" th:utext="${html}">
    </div>
    <section th:replace="~{views/backlinks :: backlinks}">
    </section>
  </article>
  <nav
    th:if="${post != null and (previous != null or next != null)}"
    class="project-document-neighbors course-neighbors"
    aria-label="이전·다음 회차"
  >
    <a th:if="${previous != null}" th:href="${previous.href}"><span th:text="|← 이전 ${previous.number}강|">이전</span><strong th:text="${previous.title}">이전</strong></a><a th:if="${next != null}" th:href="${next.href}"><span th:text="|다음 ${next.number}강 →|">다음</span><strong th:text="${next.title}">다음</strong></a>
  </nav>
</main>
