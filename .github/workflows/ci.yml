name: CI

# 실행 브랜치·변경 경로·수동 실행 조건
on:
  push:
    branches: [main]
    paths:
      - 'src/main/java/**'
      - 'src/main/resources/**'
      - '!src/main/resources/web/**'
      - 'src/test/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/ci.yml'
      - 'deploy/**'
      - '*compose*'
      - '.env*'
  pull_request:
    paths:
      - 'src/main/java/**'
      - 'src/main/resources/**'
      - '!src/main/resources/web/**'
      - 'src/test/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/ci.yml'
      - 'deploy/**'
      - '*compose*'
      - '.env*'
  workflow_dispatch:

# 워크플로 실행에 필요한 저장소 권한
permissions:
  contents: read

# 검증·산출물 생성 작업
jobs:
  # 격리 MySQL에서 Spring 빌드·테스트 실행
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Validate deployment configuration
        run: bash deploy/verify-config.sh
      - name: Verify Spring application
        run: ./gradlew --no-daemon clean build prepareMysqlTlsVerification
      - name: Verify MySQL TLS identity boundary
        run: bash deploy/verify-mysql-tls.sh build/verification/mysql-connector-j-*.jar
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Prepare isolated HTTPS browser verification
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify schema rollout and cross-site authentication
        run: python3 deploy/verify-review-runtime.py

  # 테스트 성공 후 ARM64 JVM 이미지 생성·실행 검증
  jvm-image:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4.11
        env:
          MYSQL_DATABASE: ken_blog_jvm_ci
          MYSQL_USER: ci_jvm
          MYSQL_PASSWORD: ci_jvm_ephemeral_only
          MYSQL_ROOT_PASSWORD: ci_jvm_root_ephemeral_only
        ports:
          - 13308:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      IMAGE_NAME: ken-blog-api:jvm-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Build Linux ARM64 JVM image with Cloud Native Buildpacks
        run: |
          # 러너 아키텍처 확인 후 Buildpacks 이미지 생성
          test "$(uname -m)" = aarch64
          ./gradlew --no-daemon bootBuildImage \
            --imageName="$IMAGE_NAME" \
            --environment BP_JVM_VERSION=25
      - name: Verify and archive JVM image
        run: |
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE_NAME")" = linux/arm64
          # 이미지 플랫폼·비루트 기본 사용자 확인
          image_user=$(docker image inspect --format '{{.Config.User}}' "$IMAGE_NAME")
          case "$image_user" in
            ''|root|root:*|0|0:*) echo 'JVM image must declare a non-root user' >&2; exit 1 ;;
          esac
          # Buildpacks 구성 검증 후 이미지·체크섬·출처 기록
          mkdir -p "$RUNNER_TEMP/ken-blog-jvm-image"
          docker image inspect --format '{{ index .Config.Labels "io.buildpacks.build.metadata" }}' "$IMAGE_NAME" \
            > "$RUNNER_TEMP/ken-blog-jvm-image/buildpacks.json"
          jq -e '(.buildpacks | any(.id == "paketo-buildpacks/bellsoft-liberica")) and
            (.buildpacks | all(.id != "paketo-buildpacks/native-image"))' \
            "$RUNNER_TEMP/ken-blog-jvm-image/buildpacks.json" >/dev/null
          docker save "$IMAGE_NAME" | gzip -1 > "$RUNNER_TEMP/ken-blog-jvm-image/image.tar.gz"
          cd "$RUNNER_TEMP/ken-blog-jvm-image"
          sha256sum image.tar.gz > image.tar.gz.sha256
          printf 'image=%s\nsource_sha=%s\nplatform=linux/arm64\ndefault_user=%s\n' \
            "$IMAGE_NAME" "$GITHUB_SHA" "$image_user" > image.txt
      - name: Start JVM image with production storage identity
        run: |
          # 빈 CI DB의 인증 상태는 일반 앱 기동과 분리해 명시적으로 설치
          docker exec -i '${{ job.services.mysql.id }}' sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" exec mysql --user="$MYSQL_USER" "$MYSQL_DATABASE"' < deploy/sql/bootstrap-auth.sql
          # 운영과 같은 UID·GID의 임시 저장소로 API 기동
          sudo install -d -o 10001 -g 1001 -m 0750 "$RUNNER_TEMP/ken-blog-jvm-assets"
          docker run -d --name ken-blog-jvm-ci --network host --user 10001:1001 --memory 1536m --cpus 1 \
            -e BPL_JVM_HEAD_ROOM=10 \
            -e JAVA_TOOL_OPTIONS=-XX:MaxMetaspaceSize=256m \
            -e APP_CORS_ALLOWED_ORIGINS=https://gjaku1031.github.io \
            -e APP_AUTH_CORS_ALLOWED_ORIGINS=https://gjaku1031.github.io \
            -e DB_URL=jdbc:mysql://127.0.0.1:13308/ken_blog_jvm_ci \
            -e DB_USERNAME=ci_jvm -e DB_PASSWORD=ci_jvm_ephemeral_only \
            -e ADMIN_USERNAME=ci_jvm_admin \
            -e SESSION_COOKIE_SECURE=false -e SESSION_COOKIE_SAME_SITE=lax -e SESSION_COOKIE_PARTITIONED=false \
            -e APP_ASSETS_DIRECTORY=/var/lib/ken-blog/assets \
            --mount "type=bind,source=$RUNNER_TEMP/ken-blog-jvm-assets,target=/var/lib/ken-blog/assets,readonly" \
            "$IMAGE_NAME"
          # 종료 시 실패 진단을 남기고 검증 컨테이너 정리
          cleanup() {
            result=$?
            if [ "$result" -ne 0 ]; then
              docker logs ken-blog-jvm-ci || true
              docker inspect --format '{{.State.Status}} OOMKilled={{.State.OOMKilled}} ExitCode={{.State.ExitCode}}' ken-blog-jvm-ci || true
            fi
            docker rm -f ken-blog-jvm-ci >/dev/null 2>&1 || true
            exit "$result"
          }
          trap cleanup EXIT
          # 최대 재시도 내 상태 점검 성공 대기
          for attempt in $(seq 1 60); do
            if curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:8080/actuator/health 2>/dev/null \
              | jq -e '.status == "UP"' >/dev/null; then
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' ken-blog-jvm-ci)" != true ]; then
              docker logs ken-blog-jvm-ci
              exit 1
            fi
            sleep 2
          done
          if ! curl -fsS --max-time 5 http://127.0.0.1:8080/actuator/health \
            | jq -e '.status == "UP"'; then
            docker logs ken-blog-jvm-ci
            exit 1
          fi
          # 기동 완료 후 CI 전용 DB에만 관리자 직접 등록, 운영 초기화와 분리
          docker exec -i '${{ job.services.mysql.id }}' sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" exec mysql --user="$MYSQL_USER" "$MYSQL_DATABASE"' <<'SQL'
          INSERT INTO users (username, password_hash, role, created_at, enabled)
          VALUES ('ci_jvm_admin', '{bcrypt}$2b$10$4FBi6otvIFtcNbMAYerE3O1eSZAmB9sw3r4iEgU2ovjbUuSVcfivG', 'ADMIN', UTC_TIMESTAMP(6), true);
          SQL
          if ! curl -fsS --max-time 5 http://127.0.0.1:8080/api/v1/auth/csrf \
            | jq -e '.headerName == "X-CSRF-TOKEN" and (.token | type == "string" and length > 0)'; then
            docker logs ken-blog-jvm-ci
            exit 1
          fi
          docker exec ken-blog-jvm-ci sh -c 'test ! -e /app/content && test ! -e /workspace/content'
          # PID 1이 실제 JVM인지 확인
          java_executable=$(docker exec ken-blog-jvm-ci readlink /proc/1/exe)
          case "$java_executable" in
            */bin/java) ;;
            *) echo 'API PID 1 must be the JVM' >&2; exit 1 ;;
          esac
          docker exec ken-blog-jvm-ci "$java_executable" -version
          # 원고 마운트 없는 실제 JVM에서 관리자 HTTP·이미지·인증·jOOQ 검증
          python3 - <<'PY'
          import base64
          import http.cookiejar
          import json
          import os
          from pathlib import Path
          import subprocess
          import struct
          import urllib.error
          import urllib.request
          import zlib

          # 쿠키 없는 클라이언트와 세션 유지 클라이언트 분리
          base = 'http://127.0.0.1:8080'
          public = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          auth = urllib.request.build_opener(urllib.request.ProxyHandler({}),
              urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          csrf = None

          # CSRF·쿠키를 반영해 HTTP 요청 후 상태·오류 원문 노출 검사
          def request(method, path, data=None, expected=200, authenticated=True, content_type='application/json'):
              payload = json.dumps(data).encode() if data is not None and content_type == 'application/json' else data
              headers = {'Accept': '*/*', 'Content-Type': content_type}
              # 변경 요청에 현재 CSRF 토큰 첨부
              if authenticated and csrf and method != 'GET':
                  headers['X-CSRF-TOKEN'] = csrf
              req = urllib.request.Request(base + path, payload, headers=headers, method=method)
              try:
                  response = (auth if authenticated else public).open(req, timeout=30)
              except urllib.error.HTTPError as error:
                  response = error
              # 응답 본문·상태 확인 후 연결 해제
              with response:
                  body = response.read()
                  assert response.status == expected, (method, path, response.status, body)
                  if expected >= 400:
                      assert b'secret-marker' not in body
                  return json.loads(body) if 'json' in response.headers.get_content_type() else body

          # 본문 데이터가 관리자 메타데이터 응답에 없는지 확인
          def metadata(post):
              assert 'body' not in post and 'bodySha256' not in post, post
              return post

          # PNG 청크 길이·타입·본문·CRC 구성
          def chunk(kind, payload):
              return struct.pack('>I', len(payload)) + kind + payload + struct.pack('>I', zlib.crc32(kind + payload))

          # 검증용 작은 PNG 바이트 생성
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', 2, 2, 8, 6, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress((b'\x00' + b'\xff\x00\x00\xff' * 2) * 2))
          png += chunk(b'IEND', b'')
          # 기존 이미지 검증의 JPEG fixture 유지
          jpeg = base64.b64decode(
              ''
          )

          # 격리 CI DB·디스크에 직접 등록한 64px PNG 기술 목록. 런타임 동기화 없음.
          icon = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack('>IIBBBBB', 64, 64, 8, 6, 0, 0, 0))
          icon += chunk(b'IDAT', zlib.compress((b'\x00' + b'\x00\xff\x00\xff' * 64) * 64)) + chunk(b'IEND', b'')
          temporary = Path(os.environ['RUNNER_TEMP']) / 'ci-stack.png'
          temporary.write_bytes(icon)
          # CI 파일·DB에 기술 이미지 직접 준비
          icon_dir = Path(os.environ['RUNNER_TEMP']) / 'ken-blog-jvm-assets/ken-blog/attachments'
          subprocess.run(['sudo', 'install', '-d', '-o', '10001', '-g', '1001', '-m', '0750', str(icon_dir)], check=True)
          sql = []
          for index, name in enumerate(['JVM CI PNG', 'JVM CI Local'], 1):
              filename = f'00000000-0000-4000-8000-{index:012d}.png'
              subprocess.run(['sudo', 'install', '-o', '10001', '-g', '1001', '-m', '0600', str(temporary), str(icon_dir / filename)], check=True)
              sql.append(f"INSERT INTO stack_badges (name,name_key,object_key,created_at,updated_at) VALUES ('{name}','{name.lower()}',"
                         f"'ken-blog/attachments/{filename}',UTC_TIMESTAMP(6),UTC_TIMESTAMP(6));")
          subprocess.run(['docker', 'exec', '-i', '${{ job.services.mysql.id }}', 'sh', '-c',
                          'MYSQL_PWD="$MYSQL_PASSWORD" exec mysql -u"$MYSQL_USER" "$MYSQL_DATABASE"'],
                         input='\n'.join(sql), text=True, check=True)

          # 익명 접근 거부 후 세션 로그인·CSRF 교체 검증
          request('GET', '/api/v1/admin/posts', expected=401, authenticated=False)
          csrf = request('GET', '/api/v1/auth/csrf')['token']
          request('POST', '/api/v1/auth/login', {'password': 'jvm-ci-ephemeral-only', 'rememberMe': True})
          assert request('GET', '/api/v1/auth/me')['username'] == 'ci_jvm_admin'
          csrf = request('GET', '/api/v1/auth/csrf')['token']
          # 인증·유효 CSRF 요청에서 제거된 엔드포인트의 일반 404 확인
          for path in ['/mcp', '/mcp/anything']:
              request('GET', path, expected=404)
              request('POST', path, {}, expected=404)

          # 본문 이미지도 격리 DB·디스크에 직접 준비, 앱 업로드·삭제 경로 없음
          attachment_ids = []
          for index, (mime, extension, image) in enumerate([('image/png', 'png', png), ('image/jpeg', 'jpg', jpeg)], 101):
              filename = f'00000000-0000-4000-8000-{index:012d}.{extension}'
              temporary.write_bytes(image)
              subprocess.run(['sudo', 'install', '-o', '10001', '-g', '1001', '-m', '0600', str(temporary), str(icon_dir / filename)], check=True)
              sql = ("INSERT INTO attachments (object_key,original_filename,content_type,byte_size,uploaded_by,status,pending_cleanup,created_at,updated_at) "
                     f"SELECT 'ken-blog/attachments/{filename}','fixture.{extension}','{mime}',{len(image)},id,'READY',false,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6) "
                     "FROM users WHERE username='ci_jvm_admin'; SELECT LAST_INSERT_ID();")
              result = subprocess.run(['docker', 'exec', '-i', '${{ job.services.mysql.id }}', 'sh', '-c',
                          'MYSQL_PWD="$MYSQL_PASSWORD" exec mysql -N -u"$MYSQL_USER" "$MYSQL_DATABASE"'],
                         input=sql, text=True, capture_output=True, check=True)
              attachment_ids.append(int(result.stdout.strip()))
          for path in ['/api/v1/admin/attachments', '/api/v1/admin/attachments/1', '/api/v1/admin/attachments/1/content']:
              request('GET', path, expected=404)
              request('POST', path, {}, expected=404)
              request('DELETE', path, expected=404)
          # 기술 목록과 공개 이미지 원본·크기 검증
          badges = request('GET', '/api/v1/admin/stack-badges')
          assert [badge['name'] for badge in badges] == ['JVM CI PNG', 'JVM CI Local']
          for badge in badges:
              stored = request('GET', badge['imageUrl'], authenticated=False)
              assert stored == icon and struct.unpack('>II', stored[16:24]) == (64, 64)

          # 분류·프로젝트·미발행 글 메타데이터 생성
          category = request('POST', '/api/v1/admin/categories', {'path': 'CI/HTTP'}, 201)
          series = request('POST', '/api/v1/admin/series', {
              'slug': 'jvm-ci-series', 'kind': 'PROJECT',
              'metadata': {'name': 'JVM CI Project', 'projectStatus': 'PLAN',
                           'startPeriod': '2026.10', 'stackBadgeNames': ['JVM CI PNG']},
          })
          assert series['kind'] == 'PROJECT' and series.get('cover') is None, series
          assert series['startPeriod'] == '2026.10' and len(series['stackBadges']) == 1, series
          slug = 'jvm-ci-project'
          post = metadata(request('POST', '/api/v1/admin/posts', {
              'title': 'JVM CI Project', 'slug': slug, 'seriesId': series['id'], 'order': 1,
              'categoryId': category['id'], 'tags': ['Kotlin'],
          }, 201))
          assert post['series']['id'] == series['id'] and post['section'] == 'PROJECT' and post['status'] == 'DRAFT', post
          # 글 메타데이터와 첨부 연결 교체 검증
          post_path = '/api/v1/admin/posts/' + str(post['id'])
          assert metadata(request('GET', post_path))['slug'] == slug
          assert metadata(request('PUT', post_path + '/metadata', {
              'title': 'JVM CI Project', 'summary': 'HTTP metadata only', 'categoryId': category['id'], 'tags': ['Spring'],
              'baseVersion': post['editVersion'], 'seriesId': series['id'], 'order': 1, 'relatedSeriesId': None,
          }))['tags'] == ['Spring']
          assert metadata(request('PUT', post_path + '/attachments', {'attachmentIds': attachment_ids}))['attachmentIds'] == attachment_ids
          assert request('GET', '/api/v1/admin/posts')['totalElements'] == 1
          assert request('GET', '/api/v1/admin/series/' + str(series['id']))['posts'][0]['id'] == post['id']
          snapshot = request('GET', '/api/v1/pages/snapshot', authenticated=False)
          assert snapshot['version'] == 3 and len(snapshot['revision']) == 64
          assert snapshot['posts'] == [] and snapshot['series'] == [] and 'profile' not in snapshot

          # 발행 후 스냅샷·검색·이미지 공개 확인
          metadata(request('PUT', post_path + '/publication', {'published': True}))
          snapshot = request('GET', '/api/v1/pages/snapshot', authenticated=False)
          assert len(snapshot['posts']) == 1 and len(snapshot['series']) == 1
          assert snapshot['series'][0]['cover']['id'] == post['id']
          assert metadata(snapshot['posts'][0])['section'] == 'PROJECT'
          for image_id, original in zip(attachment_ids, [png, jpeg]):
              assert request('GET', '/api/v1/posts/' + str(post['id']) + '/attachments/' + str(image_id) + '/content', authenticated=False) == original
          # 발행 취소·로그아웃 후 공개 데이터·인증 상태 회수 확인
          metadata(request('PUT', post_path + '/publication', {'published': False}))
          assert request('GET', '/api/v1/pages/snapshot', authenticated=False)['posts'] == []
          # 표시명 수정·원자적 형제 정렬과 초안·관련 글 삭제 제약 검증
          renamed = request('PUT', '/api/v1/admin/categories/' + str(category['id']) + '/name', {'name': 'Renamed'})
          assert renamed['path'] == category['path'] and renamed['name'] == 'Renamed'
          roots = request('GET', '/api/v1/admin/categories')
          request('PUT', '/api/v1/admin/categories/order', {'parentId': None, 'ids': [root['id'] for root in reversed(roots)]})
          series_path = '/api/v1/admin/series/' + str(series['id'])
          request('DELETE', series_path, expected=409)
          related = metadata(request('POST', '/api/v1/admin/posts', {'title': 'Related draft', 'relatedSeriesId': series['id']}, 201))
          request('DELETE', post_path, expected=204)
          request('GET', post_path, expected=404)
          request('DELETE', series_path, expected=409)
          request('DELETE', '/api/v1/admin/posts/' + str(related['id']), expected=204)
          request('DELETE', series_path, expected=204)
          request('GET', series_path, expected=404)
          request('POST', '/api/v1/auth/logout', expected=204)
          request('GET', '/api/v1/auth/me', expected=401)
          print('PASS HTTP login/logout, metadata/publication, PNG/JPEG attachments, local 64px icons, jOOQ reads, Pages v3 and removed endpoint; no API Markdown files')
          PY
      - name: Upload reviewed image archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ken-blog-jvm-arm64-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ken-blog-jvm-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
