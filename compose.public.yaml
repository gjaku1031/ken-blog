# Spring 내장 Tomcat이 HTTPS와 HTTP-01을 직접 처리. 내부 HTTP/MCP는 loopback 18081만 유지.
services:
  api:
    environment:
      SPRING_PROFILES_ACTIVE: direct-https
      SERVER_PORT: "8443"
      SERVER_FORWARD_HEADERS_STRATEGY: none
    ports:
      - "${KEN_BLOG_PUBLIC_BIND_IP:?Private NIC bind IP is required}:80:8082"
      - "${KEN_BLOG_PUBLIC_BIND_IP:?Private NIC bind IP is required}:443:8443"
    volumes:
      - type: bind
        source: ${KEN_BLOG_TLS_DIR:?Dedicated TLS directory is required}
        target: /run/ken-blog-tls
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${KEN_BLOG_ACME_WEBROOT_DIR:?Absolute ACME webroot directory is required}
        target: /run/ken-blog-acme
        read_only: true
        bind:
          create_host_path: false
