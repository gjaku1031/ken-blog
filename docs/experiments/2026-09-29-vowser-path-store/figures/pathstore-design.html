<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>경로 저장소 비교 실험의 설계</title>
<style>
/* 근거: operations/PROTOCOL.md(입력·200연산 trace·warmup 뒤 reset·oracle·라운드 순서 Neo→SQL, SQL→Neo, Neo→SQL),
   operations/report.md(DB 1 CPU/3 GiB + worker 1 CPU/1 GiB, 한 DB씩 기동, 48블록·9,600 timed 요청 전부 정답),
   shared/CONTRACT.md(공통 자원·데이터 계약) */
:root { --bg:#ffffff; --panel:#f6f7f9; --ink:#1a2030; --soft:#4a5368; --muted:#6b7386; --line:#d3d8e1;
  --my:#2b59c3; --my-soft:#e3eafa; --neo:#1d6a55; --neo-soft:#e0eee8; --acc:#b06d00; --acc-soft:#fbefd9; }
@media (prefers-color-scheme: dark) { :root { --bg:#171b24; --panel:#1d2230; --ink:#e4e8f0; --soft:#a9b2c3; --muted:#8a93a6; --line:#2c3442;
  --my:#7aa2ff; --my-soft:#1d2a47; --neo:#5fc6a5; --neo-soft:#19302a; --acc:#e3a64a; --acc-soft:#34291a; } }
body { margin:0; background:var(--bg); font-family:"Noto Sans CJK KR","Apple SD Gothic Neo",sans-serif; }
#figure { width:1200px; padding:28px; box-sizing:border-box; background:var(--bg); }
svg text { fill:var(--ink); font-size:15px; }
.panel { fill:var(--panel); stroke:var(--line); }
.h { font-size:19px; font-weight:700; }
.sub { fill:var(--muted); font-size:13.5px; }
.lab { fill:var(--muted); font-size:12.5px; }
.b { font-weight:600; }
.box { fill:var(--bg); stroke:var(--soft); stroke-width:1.4; }
.my { fill:var(--my-soft); stroke:var(--my); stroke-width:1.6; } .t-my { fill:var(--my); font-weight:700; }
.neo { fill:var(--neo-soft); stroke:var(--neo); stroke-width:1.6; } .t-neo { fill:var(--neo); font-weight:700; }
.acc { fill:var(--acc-soft); stroke:var(--acc); stroke-width:1.8; } .t-acc { fill:var(--acc); font-weight:700; }
.edge { stroke:var(--soft); stroke-width:1.5; fill:none; }
.dash { stroke-dasharray:6 4; }
.head { fill:var(--soft); }
</style></head><body>
<div id="figure"><svg id="chart" viewBox="0 0 1144 640" width="1144" height="640" role="img"
aria-label="같은 합성 데이터와 같은 요청 순서, 같은 자원 한도로 두 DB를 하나씩 번갈아 실행하고, 라운드마다 실행 순서를 바꾸며, 블록마다 워밍업과 상태 되돌림 뒤 200건을 측정해 미리 계산한 정답과 모두 대조함"></svg></div>
<script>
(() => {
  const NS = "http://www.w3.org/2000/svg", svg = document.getElementById("chart");
  const el = (t, a, txt) => { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); if (txt != null) n.textContent = txt; svg.appendChild(n); return n; };
  const defs = el("defs", {}), mk = document.createElementNS(NS, "marker");
  for (const [k, v] of Object.entries({ id: "a", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto" })) mk.setAttribute(k, v);
  const mp = document.createElementNS(NS, "path"); mp.setAttribute("d", "M0,0 L10,5 L0,10 z"); mp.setAttribute("class", "head"); mk.appendChild(mp); defs.appendChild(mk);
  const box = (x, y, w, h, title, sub, cls, tcls) => {
    el("rect", { x, y, width: w, height: h, rx: 9, class: cls });
    el("text", { x: x + w / 2, y: y + h / 2 - (sub ? 4 : -5), "text-anchor": "middle", class: tcls || "b" }, title);
    if (sub) el("text", { x: x + w / 2, y: y + h / 2 + 16, "text-anchor": "middle", class: "sub" }, sub);
  };
  const panel = (y, h, title, sub) => {
    el("rect", { x: 0, y, width: 1144, height: h, rx: 14, class: "panel" });
    const t = el("text", { x: 20, y: y + 32, class: "h" }, title);
    if (sub) el("text", { x: 20 + t.getComputedTextLength() + 14, y: y + 32, class: "sub" }, sub);
  };
  const arrow = (d, label, lx, ly, anchor, dashed) => {
    el("path", { d, class: "edge" + (dashed ? " dash" : ""), "marker-end": "url(#a)" });
    if (label) el("text", { x: lx, y: ly, "text-anchor": anchor || "middle", class: "lab" }, label);
  };

  // 1. 두 DB에 똑같이 주는 조건
  panel(0, 136, "같은 조건", "두 DB에 똑같이 줌");
  const IW = 348, IG = (1104 - 3 * IW) / 2;
  box(20, 52, IW, 64, "합성 경로 데이터", "1천·1만·3만 개 · 깊이 5·10·20", "box");
  box(20 + IW + IG, 52, IW, 64, "고정 요청 순서 200건", "인기·시각화·등록·갱신을 섞음", "box");
  box(20 + 2 * (IW + IG), 52, IW, 64, "같은 자원 한도", "DB 1 CPU·3GiB · 요청 작업 1 CPU·1GiB", "box");
  arrow("M572,136 L572,178", "모든 블록에 같게", 584, 162, "start");

  // 2. 실행 순서: 한 번에 DB 하나, 라운드마다 순서 교차
  const Y2 = 180;
  panel(Y2, 166, "실행 순서", "조건마다 · 한 번에 DB 하나만 실행 · 라운드마다 먼저 하는 DB를 바꿈");
  const order = [["Neo4j", "MySQL"], ["MySQL", "Neo4j"], ["Neo4j", "MySQL"]];
  const GW = 350, GG = (1104 - 3 * GW) / 2, BW = 130, by = Y2 + 86, BHt = 60;
  order.forEach((pair, g) => {
    const gx = 20 + g * (GW + GG);
    el("text", { x: gx, y: by - 12, class: "b" }, `${g + 1}라운드`);
    pair.forEach((db, j) => {
      const x = gx + j * (GW - BW), c = db === "MySQL" ? "my" : "neo";
      box(x, by, BW, BHt, db, "200건 측정", c, "t-" + c);
    });
    arrow(`M${gx + BW},${by + BHt / 2} L${gx + GW - BW - 3},${by + BHt / 2}`, "앞 DB 끄고", gx + GW / 2, by + BHt / 2 - 8);
    if (g < 2) arrow(`M${gx + GW},${by + BHt / 2} L${gx + GW + GG - 3},${by + BHt / 2}`, "", 0, 0);
  });

  // 첫 블록을 펼침
  const Y3 = 404;
  arrow(`M${20 + BW / 2},${by + BHt} L${20 + BW / 2},${Y3 - 2}`, "블록 하나를 펼치면", 20 + BW / 2 + 12, Y3 - 16, "start", true);

  // 3. 블록 하나의 안쪽
  panel(Y3, 236, "블록 하나", "측정 전 준비와 측정 뒤 대조");
  const SW = 168, SG = (1104 - 5 * SW) / 4, sy = Y3 + 54, SH = 64;
  const sx = i => 20 + i * (SW + SG);
  box(sx(0), sy, SW, SH, "DB 재시작", "접속 확인까지", "box");
  box(sx(1), sy, SW, SH, "워밍업 200건", "기록하지 않음", "box");
  box(sx(2), sy, SW, SH, "상태 되돌림", "처음 데이터로", "box");
  box(sx(3), sy, SW, SH, "측정 200건", "요청마다 지연 기록", "box");
  box(sx(4), sy, SW, SH, "정답과 대조", "모든 응답·최종 가중치", "acc", "t-acc");
  ["준비 후", "끝나면", "같은 순서로", "응답마다"].forEach((t, i) =>
    arrow(`M${sx(i) + SW},${sy + SH / 2} L${sx(i + 1) - 3},${sy + SH / 2}`, t, (sx(i) + SW + sx(i + 1)) / 2, sy + SH / 2 - 8));
  const oy = sy + SH + 44;
  box(sx(4), oy, SW, 56, "미리 계산한 정답", "측정 전에 따로 계산", "box");
  arrow(`M${sx(4) + SW / 2},${oy} L${sx(4) + SW / 2},${sy + SH + 3}`, "대조", sx(4) + SW / 2 + 10, oy - 16, "start");
  el("text", { x: 20, y: oy + 24, class: "t-acc" }, "조건 8개 × 3라운드 × DB 2개 = 48블록");
  el("text", { x: 20, y: oy + 48, class: "b" }, "측정 요청 9,600건 모두 정답 · 오류·시간 초과 0");
  document.body.dataset.ready = "1";
})();
</script></body></html>
