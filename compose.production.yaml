# 독립 운영 스택. --env-file에 저장소 밖 0600 production.env 사본을 지정.
# DB는 기존 외부 MySQL을 사용하며, api와 caddy만 이 Compose 네트워크에 둔다.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ken-blog-api:production
    restart: unless-stopped
    env_file:
      - path: ${KEN_BLOG_PRODUCTION_ENV_FILE:?Dedicated production env file is required}
        required: true
        format: raw
    environment:
      SPRING_PROFILES_ACTIVE: caddy
      SERVER_PORT: "8080"
      SERVER_FORWARD_HEADERS_STRATEGY: none
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_SAME_SITE: none
      SESSION_COOKIE_PARTITIONED: "true"
      APP_CORS_ALLOWED_ORIGINS: https://gjaku1031.github.io
      APP_AUTH_CORS_ALLOWED_ORIGINS: https://gjaku1031.github.io
      APP_ASSETS_DIRECTORY: /var/lib/ken-blog/assets
      APP_CONTENT_DIRECTORY: /app/content
      APP_MCP_ALLOWED_HOSTS: 127.0.0.1:${API_PORT:-18081}
    ports:
      - "127.0.0.1:${API_PORT:-18081}:8080"
    volumes:
      - type: bind
        source: ${KEN_BLOG_ASSETS_DIR:?Durable local assets directory is required}
        target: /var/lib/ken-blog/assets
        bind:
          create_host_path: false
      - type: bind
        source: ${KEN_BLOG_CONTENT_DIR:?Repository content checkout directory is required}
        target: /app/content
        bind:
          create_host_path: false
    # 512MiB 힙 외 JVM 네이티브 메모리에도 약 512MiB를 남긴다.
    mem_limit: 1g
    cpus: 1.0

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      KEN_BLOG_PUBLIC_IP: ${KEN_BLOG_PUBLIC_IP:?Public IPv4 certificate SAN is required}
      KEN_BLOG_PUBLIC_BIND_IP: ${KEN_BLOG_PUBLIC_BIND_IP:?Private NIC bind IPv4 is required}
    entrypoint: ["/bin/sh", "/usr/local/bin/start-caddy.sh"]
    command: ["run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "${KEN_BLOG_PUBLIC_BIND_IP:?Private NIC bind IPv4 is required}:80:80"
      - "${KEN_BLOG_PUBLIC_BIND_IP:?Private NIC bind IPv4 is required}:443:443"
    volumes:
      - type: bind
        source: ./deploy/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./deploy/start-caddy.sh
        target: /usr/local/bin/start-caddy.sh
        read_only: true
        bind:
          create_host_path: false
      - ken_blog_caddy_data:/data
      - ken_blog_caddy_config:/config

volumes:
  ken_blog_caddy_data:
  ken_blog_caddy_config:
