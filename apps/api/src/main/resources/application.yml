spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: ken-blog-api
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 * * * * *"
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  servlet:
    session:
      cookie:
        name: KENBLOGSESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  attachment:
    storage:
      endpoint: ${OCI_OBJECT_STORAGE_ENDPOINT:}
      region: ${OCI_OBJECT_STORAGE_REGION:}
      bucket: ${OCI_OBJECT_STORAGE_BUCKET:}
      access-key: ${OCI_OBJECT_STORAGE_ACCESS_KEY:}
      secret-key: ${OCI_OBJECT_STORAGE_SECRET_KEY:}
      key-prefix: ${OCI_OBJECT_STORAGE_KEY_PREFIX:ken-blog/attachments}
  auth:
    cors:
      allowed-origins: ${APP_AUTH_CORS_ALLOWED_ORIGINS:}
  bootstrap:
    admin:
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      password-hash: ${BOOTSTRAP_ADMIN_PASSWORD_HASH:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://gjaku1031.github.io}
