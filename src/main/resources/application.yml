spring:
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: ken-blog
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      cleanup-cron: 0 * * * * *
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: ${APP_JPA_DDL_AUTO:update}
server:
  servlet:
    session:
      cookie:
        name: KENBLOGSESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        partitioned: ${SESSION_COOKIE_PARTITIONED:false}
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  assets:
    directory: ${APP_ASSETS_DIRECTORY:}
    key-prefix: ${APP_ASSETS_KEY_PREFIX:ken-blog/attachments}
  auth:
    cors:
      allowed-origins: ${APP_AUTH_CORS_ALLOWED_ORIGINS:}
    admin:
      username: ${ADMIN_USERNAME:}
  bootstrap:
    admin:
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      password-hash: ${BOOTSTRAP_ADMIN_PASSWORD_HASH:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
