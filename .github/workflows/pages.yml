name: Pages
run-name: Pages main

# 실행 브랜치·변경 경로·수동 실행 조건
on:
  push:
    branches: [main]
    paths:
      - 'content/posts/**'
      - 'src/main/resources/web/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# 완료 직전 배포가 취소되지 않도록 직렬 실행
concurrency:
  group: github-pages
  cancel-in-progress: false

# 워크플로 실행에 필요한 저장소 권한
permissions:
  contents: read

# 검증·산출물 생성 작업
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Record artifact source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install static build dependencies
        run: npm ci
      - name: Compute browser bundle input version
        id: assets
        run: echo "key=$(node src/main/resources/web/build.mjs --cache-key)" >> "$GITHUB_OUTPUT"
      - name: Reuse browser bundles when inputs match
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          key: web-assets-${{ steps.assets.outputs.key }}
          path: |
            build/web-assets.json
            build/public-assets
            build/admin-assets
      - name: Check types and generate empty site
        run: npm test
      - name: Capture public content and build Pages site
        env:
          PUBLIC_API_BASE_URL: ${{ vars.BLOG_API_BASE_URL }}
          SITE_BASE_PATH: /ken-blog
          # 공개 측정 ID만 전달하며 서비스 계정 키는 빌드에 사용하지 않음
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
        run: |
          # 설정 누락으로 방문 추적이 빠진 운영 산출물의 배포 방지
          test -n "$GA_MEASUREMENT_ID" || { echo 'GA_MEASUREMENT_ID repository variable is required.' >&2; exit 1; }
          npm run build:site
      - name: Verify public site artifact
        run: |
          # 필수 페이지 존재와 내부 파일 미포함 확인
          test -s build/site/index.html
          test -s build/site/manage/index.html
          if find build/site -type f | grep -E '/(AGENTS\.md|\.env[^/]*|build\.gradle(\.kts)?|settings\.gradle(\.kts)?|gradlew)$'; then
            echo 'Unexpected internal file in Pages artifact.' >&2
            exit 1
          fi
      - name: Reject superseded site inputs before publishing
        run: |
          # 빌드 이후 변경된 공개 사이트 입력이 있으면 배포 중단
          current=$(git rev-parse HEAD)
          git fetch --depth=1 origin main
          git diff --quiet "$current" FETCH_HEAD -- \
            content/posts src/main/resources/web package.json package-lock.json tsconfig.json \
            .github/pages .github/workflows/pages.yml
          printf 'source=%s\n' "$current" >> "$GITHUB_STEP_SUMMARY"
          node -e 'console.log("assets=" + JSON.parse(require("node:fs").readFileSync("build/web-assets.json")).key)' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  # 배포 권한은 의존성 설치·빌드 코드를 실행하지 않는 작업에만 부여
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out artifact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source }}
      - name: Reject changed site inputs immediately before deployment
        run: |
          git fetch --depth=1 origin main
          git diff --quiet HEAD FETCH_HEAD -- \
            content/posts src/main/resources/web package.json package-lock.json tsconfig.json \
            .github/pages .github/workflows/pages.yml
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy artifact from this workflow run
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
