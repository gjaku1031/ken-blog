# 운영 Compose에서만 활성화. 기본 개발/기존 검사는 HTTP 8080 유지.
server:
  port: 8443
  forward-headers-strategy: none
  ssl:
    enabled: true
    bundle: public-web
spring:
  ssl:
    bundle:
      watch:
        file:
          quiet-period: 2s
      pem:
        public-web:
          reload-on-update: true
          keystore:
            # 같은 PEM 파일에 chain과 key를 넣어 원자적 교체/재로딩.
            certificate: file:${KEN_BLOG_TLS_PEM:/run/ken-blog-tls/server.pem}
            private-key: file:${KEN_BLOG_TLS_PEM:/run/ken-blog-tls/server.pem}
          options:
            enabled-protocols: TLSv1.2,TLSv1.3
app:
  transport:
    direct-https: true
    local-port: 8080
    acme-port: 8082
    acme-webroot: ${KEN_BLOG_ACME_WEBROOT:/run/ken-blog-acme}
