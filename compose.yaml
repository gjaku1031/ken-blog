services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: ken_blog
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    ports:
    - 127.0.0.1:${DB_PORT:-13306}:3306
    volumes:
    - ken_blog_mysql_data:/var/lib/mysql
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" -D "$$MYSQL_DATABASE" -e 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
  api:
    image: ken-blog-api:local
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
      DB_URL: jdbc:mysql://mysql:3306/ken_blog
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-lax}
      SESSION_COOKIE_PARTITIONED: ${SESSION_COOKIE_PARTITIONED:-false}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD_HASH: ${BOOTSTRAP_ADMIN_PASSWORD_HASH:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:-}
      ADMIN_RECOVERY_CODE_HASHES: ${ADMIN_RECOVERY_CODE_HASHES:-}
      APP_AUTH_CORS_ALLOWED_ORIGINS: ${APP_AUTH_CORS_ALLOWED_ORIGINS:-}
      APP_MCP_ENABLED: ${APP_MCP_ENABLED:-false}
      APP_ASSETS_DIRECTORY: /var/lib/ken-blog/assets
      APP_ASSETS_KEY_PREFIX: ${APP_ASSETS_KEY_PREFIX:-ken-blog/attachments}
      APP_CONTENT_DIRECTORY: /app/content
      APP_MCP_ALLOWED_PEERS: ${APP_MCP_ALLOWED_PEERS:-127.0.0.1,::1}
      APP_MCP_ALLOWED_HOSTS: ${APP_MCP_ALLOWED_HOSTS:-127.0.0.1:18081}
      APP_DEPLOY_ENABLED: ${APP_DEPLOY_ENABLED:-false}
      APP_DEPLOY_GITHUB_TOKEN: ${APP_DEPLOY_GITHUB_TOKEN:-}
      APP_DEPLOY_CALLBACK_TOKEN: ${APP_DEPLOY_CALLBACK_TOKEN:-}
      APP_DEPLOY_REPOSITORY: ${APP_DEPLOY_REPOSITORY:-gjaku1031/ken-blog}
      APP_DEPLOY_WORKFLOW: ${APP_DEPLOY_WORKFLOW:-pages.yml}
      APP_DEPLOY_REF: ${APP_DEPLOY_REF:-main}
      APP_DEPLOY_PAGES_MARKER_URL: ${APP_DEPLOY_PAGES_MARKER_URL:-https://gjaku1031.github.io/ken-blog/deployment.json}
      APP_DEPLOY_GITHUB_API_BASE: ${APP_DEPLOY_GITHUB_API_BASE:-https://api.github.com}
    ports:
    - 127.0.0.1:${API_PORT:-18081}:8080
    volumes:
    - ken_blog_assets:/var/lib/ken-blog/assets
    - type: bind
      source: ./content
      target: /app/content
      bind:
        create_host_path: false
    mem_limit: 1g
    build:
      context: .
      dockerfile: Dockerfile
volumes:
  ken_blog_mysql_data: null
  ken_blog_assets: null
