name: Pages
run-name: Pages ${{ github.sha }}

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Set up Java for Thymeleaf generation
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install static build dependencies
        run: npm ci
      - name: Build Spring and public assets
        run: npm run build:assets
      - name: Compile standalone Thymeleaf generator
        run: ./gradlew --no-daemon -PskipWeb=true writeSiteClasspath
      - name: Capture public content and build Pages site
        env:
          PUBLIC_API_BASE_URL: ${{ vars.BLOG_API_BASE_URL }}
          SITE_BASE_PATH: /ken-blog
        run: npm run build:site
      - name: Verify public site artifact
        run: |
          test -s build/site/index.html
          if find build/site -type f | grep -E '/(AGENTS\.md|\.env[^/]*|build\.gradle\.kts|settings\.gradle\.kts|gradlew)$'; then
            echo 'Unexpected internal file in Pages artifact.' >&2
            exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: build/site
      - name: Deploy completed artifact
        id: deploy
        uses: actions/deploy-pages@v5.0.1
