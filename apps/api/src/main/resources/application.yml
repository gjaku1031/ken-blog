spring:
  application:
    name: ken-blog-api
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 * * * * *"
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  servlet:
    session:
      cookie:
        name: KENBLOGSESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  auth:
    cors:
      allowed-origins: ${APP_AUTH_CORS_ALLOWED_ORIGINS:}
  bootstrap:
    admin:
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      password-hash: ${BOOTSTRAP_ADMIN_PASSWORD_HASH:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://gjaku1031.github.io}
