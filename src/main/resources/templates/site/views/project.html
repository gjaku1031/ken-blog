<main
  xmlns:th="http://www.thymeleaf.org"
  th:fragment="main"
  id="main-content"
  class="page-container project-page project-layout"
>
  <aside class="project-sidebar" aria-label="프로젝트 탐색">
    <a th:href="${base + 'projects/'}" class="back-link">← Projects</a>
    <h2 th:text="${project.name}">프로젝트</h2>
    <nav aria-label="프로젝트 문서">
      <a th:href="${project.href}" th:attr="aria-current=${home ? 'page' : null}">대문</a>
      <ol>
        <li th:each="doc : ${docs}">
          <a
            th:href="${doc.href}"
            th:attr="aria-current=${!home and doc.slug == post.slug ? 'page' : null}"
            th:text="|${doc.number}. ${doc.title}|"
          >문서</a>
        </li>
      </ol>
    </nav>
    <section th:if="${!#lists.isEmpty(related)}" class="project-related">
      <h3 th:text="|관련 글 · Tech ${#lists.size(related)}|">관련 글</h3>
      <ul>
        <li th:each="item : ${related}">
          <a th:href="${item.href}" th:text="${item.title}">글</a>
        </li>
      </ul>
    </section>
    <nav th:replace="~{views/toc :: toc}">
    </nav>
  </aside>
  <article class="project-main card">
    <div class="project-overline" th:if="${home}">Projects</div>
    <div class="project-overline" th:unless="${home}">Projects · <a th:href="${project.href}" th:text="${project.name}">프로젝트</a> · <span th:text="${post.displayDate}">날짜</span>
    </div>
    <h1 th:text="${home ? project.name : post.title}">제목</h1>
    <div th:if="${home}" class="project-meta">
      <span class="project-status" th:classappend="${'project-status-' + project.statusClass}"><span aria-hidden="true"></span><th:block th:text="${project.statusLabel}">상태</th:block></span><span class="mono" th:text="${project.period}">기간</span>
    </div>
    <p th:if="${home and !#strings.isEmpty(project.overview)}" class="project-overview" th:text="${project.overview}">
    </p>
    <div th:if="${home and !#lists.isEmpty(project.stackBadges)}" class="stack-badges" aria-label="기술 배지">
      <span th:each="badge : ${project.stackBadges}"><img th:src="${badge.imageUrl}" alt="" width="22" height="22"><th:block th:text="${badge.name}">배지</th:block></span>
    </div>
    <div th:if="${!home and !#lists.isEmpty(post.tags)}" class="tag-list detail-tags">
      <a th:each="tag : ${post.tags}" th:href="${base + 'tech/?tag=' + #uris.escapeQueryParam(tag)}" th:text="|#${tag}|">태그</a>
    </div>
    <div class="markdown-body" th:utext="${html}">
    </div>
    <section th:replace="~{views/backlinks :: backlinks}">
    </section>
  </article>
  <nav th:if="${!home and (previous != null or next != null)}" class="project-document-neighbors" aria-label="이전·다음 문서">
    <a th:if="${previous != null}" th:href="${previous.href}"><span>← 이전 문서</span><strong th:text="|${previous.number}. ${previous.title}|">이전</strong></a><a th:if="${next != null}" th:href="${next.href}"><span>다음 문서 →</span><strong th:text="|${next.number}. ${next.title}|">다음</strong></a>
  </nav>
</main>
