spring:
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  ai:
    mcp:
      server:
        enabled: ${APP_MCP_ENABLED:false}
        protocol: STREAMABLE
        name: ken-blog
        version: 1.0.0
        type: SYNC
        instructions: 글 작성 전 kenblog://authoring/skill 리소스를 읽으세요. 모든 글은 Post이며 일반 또는 프로젝트 시리즈에 연결할 수 있습니다.
          본문은 content/posts/{slug}.md에서 수정하고 첨부와 위키 참조는 메타데이터 도구로 선언하세요.
        streamable-http:
          mcp-endpoint: /mcp
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: ken-blog
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      cleanup-cron: 0 * * * * *
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: always
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: ${APP_JPA_DDL_AUTO:update}
server:
  servlet:
    session:
      cookie:
        name: KENBLOGSESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        partitioned: ${SESSION_COOKIE_PARTITIONED:false}
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  mcp:
    enabled: ${APP_MCP_ENABLED:false}
    allowed-peers: ${APP_MCP_ALLOWED_PEERS:127.0.0.1,::1}
    allowed-hosts: ${APP_MCP_ALLOWED_HOSTS:127.0.0.1:18081}
  assets:
    directory: ${APP_ASSETS_DIRECTORY:}
    key-prefix: ${APP_ASSETS_KEY_PREFIX:ken-blog/attachments}
  content:
    directory: ${APP_CONTENT_DIRECTORY:content}
  auth:
    cors:
      allowed-origins: ${APP_AUTH_CORS_ALLOWED_ORIGINS:}
    admin:
      username: ${ADMIN_USERNAME:}
  bootstrap:
    admin:
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      password-hash: ${BOOTSTRAP_ADMIN_PASSWORD_HASH:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
