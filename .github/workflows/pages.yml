name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Check web types and behavior
        working-directory: apps/web
        run: |
          npm run typecheck
          npm test
      - name: Export static web
        working-directory: apps/web
        env:
          NEXT_PUBLIC_BASE_PATH: /ken-blog
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL }}
        run: npm run build
      - name: Check public artifact contents
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('apps/web/out')
          if not (root / 'index.html').is_file():
              raise SystemExit('정적 홈 산출물 없음')
          files = [path.relative_to(root) for path in root.rglob('*') if path.is_file()]
          for path in files:
              if any(part == 'study' or part == 'planning' or part.startswith('.env')
                     or part in {'AGENTS.md', 'code-conventions.md'} for part in path.parts):
                  raise SystemExit(f'공개 산출물에 내부 파일 포함: {path}')
          print(f'검사한 공개 파일: {len(files)}개')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload static output only
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
