<aside xmlns:th="http://www.thymeleaf.org" th:fragment="sidebar" class="feed-sidebar" aria-label="Tech 탐색">
  <section class="side-card card">
    <h2>분류</h2>
    <ul class="category-tree">
      <li th:each="category : ${categories}">
        <div class="category-line">
          <a th:href="${'?category=' + #uris.escapeQueryParam(category)}"><span th:text="${category}">분류</span></a>
        </div>
      </li>
    </ul>
  </section>
  <section class="side-card card">
    <h2>태그</h2>
    <div class="tag-cloud">
      <a th:each="tag : ${tags}" th:href="${'?tag=' + #uris.escapeQueryParam(tag)}" th:text="|#${tag}|">#태그</a>
    </div>
  </section>
</aside>
