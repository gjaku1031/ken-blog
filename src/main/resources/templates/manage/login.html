<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자 로그인 · ken blog</title>
  <link rel="stylesheet" th:href="${assets.css}">
  <script type="module" th:src="${assets.js}"></script>
</head>
<body class="login-page">
  <main class="login-card card">
    <p class="eyebrow">KEN BLOG / MANAGE</p>
    <h1>관리자 로그인</h1>
    <p class="muted">비밀번호와 인증 앱의 일회용 코드를 입력하세요.</p>
    <p class="notice error" role="alert" th:if="${error}" th:text="${error}"></p>
    <form action="/manage/login" method="post" autocomplete="on">
      <input type="hidden" th:name="${csrfToken.parameterName}" th:value="${csrfToken.token}">
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <label for="verificationCode">MFA 코드 또는 복구 코드</label>
      <input id="verificationCode" name="verificationCode" type="text" autocomplete="one-time-code" required inputmode="text">
      <label class="check"><input name="rememberMe" type="checkbox" value="true"> 30일 동안 로그인 유지</label>
      <button class="button primary" type="submit">로그인</button>
    </form>
    <a class="text-link" href="https://gjaku1031.github.io/ken-blog/">블로그로 돌아가기</a>
  </main>
</body>
</html>
