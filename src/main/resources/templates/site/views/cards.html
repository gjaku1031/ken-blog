<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="cards"><article
    th:each="card : ${cards}"
    class="post-card card"
    data-search-card
    th:attr="data-search-text=${card.searchText},data-category=${card.categoryPath},data-tags=${card.tagText}"
  >
    <div class="card-meta">
      <strong th:text="${card.label}">Tech</strong><span th:if="${!#strings.isEmpty(card.categoryPath)}" th:text="|· ${card.categoryPath}|">분류</span><span th:if="${!#strings.isEmpty(card.context)}" th:text="|· ${card.context}|">문맥</span>
    </div>
    <div th:if="${card.section == 'TECH' and card['relatedProject'] != null}" class="card-related-project">
      <span>[연관 프로젝트]</span><th:block th:text="${card.relatedProject.name}">프로젝트</th:block>
    </div>
    <div class="card-title-row">
      <h2>
        <a th:href="${card.href}" th:text="${card.title}">제목</a>
      </h2>
    </div>
    <p th:if="${!#strings.isEmpty(card.summary)}" class="post-summary" th:text="${card.summary}">요약</p>
    <div class="card-bottom">
      <div class="tag-list">
        <a th:each="tag : ${card.tags}" th:href="${'?tag=' + #uris.escapeQueryParam(tag)}" th:text="|#${tag}|">#태그</a>
      </div>
      <time class="mono" th:datetime="${card.publishedDate}" th:text="${card.displayDate}">2026.09.30</time>
    </div>
  </article>
  <p th:if="${#lists.isEmpty(cards)}" class="message-card card">아직 공개된 글이 없습니다.</p></th:block>
