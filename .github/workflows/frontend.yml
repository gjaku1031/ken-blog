# 배포 자격 증명 없이 공개 가상 자료와 모의 API만 검증
name: Frontend
on:
  # 고정 아키텍처 표본을 포함하므로 원고만 바뀐 경우도 브라우저 검사
  pull_request:
    paths: ['src/main/resources/web/**', 'content/posts/**', '.github/pages/**', 'package*.json', 'tsconfig.json', '.github/workflows/frontend.yml']
  push:
    branches: [main, 'codex/**']
    paths: ['src/main/resources/web/**', 'content/posts/**', '.github/pages/**', 'package*.json', 'tsconfig.json', '.github/workflows/frontend.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
