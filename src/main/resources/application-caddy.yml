# Caddy가 공개 TLS를 종료하고 허용한 API 경로만 내부 HTTP 8080으로 전달.
server:
  port: 8080
  forward-headers-strategy: none
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: ${SESSION_COOKIE_SAME_SITE:none}
        partitioned: ${SESSION_COOKIE_PARTITIONED:true}
app:
  auth:
    cors:
      allowed-origins: ${APP_AUTH_CORS_ALLOWED_ORIGINS:https://gjaku1031.github.io}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://gjaku1031.github.io}
