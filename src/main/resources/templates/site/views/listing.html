<main
  xmlns:th="http://www.thymeleaf.org"
  th:fragment="main"
  id="main-content"
  class="page-container"
  th:classappend="${searching} ? 'search-page' : 'tech-page'"
>
  <div class="content-grid">
    <section class="feed-column">
      <div class="section-heading">
        <h1 th:text="${heading}">Tech</h1>
        <span id="filter-count" class="mono feed-total"></span>
      </div>
      <p th:if="${searching}" id="search-filter" class="active-filters">
      </p>
      <nav th:if="${!#lists.isEmpty(groups)}" class="tag-list" aria-label="시리즈와 소분류 대문">
        <a th:each="group : ${groups}" th:href="${group.href}" th:text="${group.name}"></a>
      </nav>
      <div class="post-list" th:insert="~{views/cards :: cards}">
      </div>
      <p id="filter-empty" class="message-card card" hidden>검색 결과가 없습니다.</p>
    </section>
    <aside th:replace="~{views/sidebar :: sidebar}">
    </aside>
  </div>
</main>
