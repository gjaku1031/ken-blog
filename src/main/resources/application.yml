spring:
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  ai:
    mcp:
      server:
        enabled: ${APP_MCP_ENABLED:false}
        protocol: STREAMABLE
        name: ken-blog
        version: 1.0.0
        type: SYNC
        instructions: 글을 작성하기 전에 kenblog://authoring/skill 리소스 또는 get_authoring_guide 도구를 읽으세요. TECH, PROJECT_HOME,
          PROJECT_DOC, NOTE_CHAPTER 중 섹션을 선택하고 본문에 쓰인 attachmentIds와 wikiTargets 전체 배열을 명시하세요. 수정 전 최신 글·편집본 상세와
          revision을 확인하고, 사용자가 요청한 범위에서만 발행하세요.
        streamable-http:
          mcp-endpoint: /mcp
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: ken-blog
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      cleanup-cron: 0 * * * * *
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  servlet:
    session:
      cookie:
        name: KENBLOGSESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        partitioned: ${SESSION_COOKIE_PARTITIONED:false}
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  mcp:
    enabled: ${APP_MCP_ENABLED:false}
    allowed-peers: ${APP_MCP_ALLOWED_PEERS:127.0.0.1,::1}
    allowed-hosts: ${APP_MCP_ALLOWED_HOSTS:127.0.0.1:18081}
  assets:
    directory: ${APP_ASSETS_DIRECTORY:}
    key-prefix: ${APP_ASSETS_KEY_PREFIX:ken-blog/attachments}
  content:
    directory: ${APP_CONTENT_DIRECTORY:content}
  auth:
    cors:
      allowed-origins: ${APP_AUTH_CORS_ALLOWED_ORIGINS:}
    admin:
      username: ${ADMIN_USERNAME:}
      totp-secret: ${ADMIN_TOTP_SECRET:}
      recovery-code-hashes: ${ADMIN_RECOVERY_CODE_HASHES:}
  bootstrap:
    admin:
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      password-hash: ${BOOTSTRAP_ADMIN_PASSWORD_HASH:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  deployment:
    enabled: ${APP_DEPLOY_ENABLED:false}
    github-token: ${APP_DEPLOY_GITHUB_TOKEN:}
    callback-token: ${APP_DEPLOY_CALLBACK_TOKEN:}
    repository: ${APP_DEPLOY_REPOSITORY:gjaku1031/ken-blog}
    workflow: ${APP_DEPLOY_WORKFLOW:pages.yml}
    ref: ${APP_DEPLOY_REF:main}
    pages-marker-url: ${APP_DEPLOY_PAGES_MARKER_URL:https://gjaku1031.github.io/ken-blog/deployment.json}
    github-api-base: ${APP_DEPLOY_GITHUB_API_BASE:https://api.github.com}
